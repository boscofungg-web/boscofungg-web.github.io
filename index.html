<title>每週固定時間表</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700&display=swap">

<style>
/* ==========================================================
   每週固定時間表 — 網頁版
   配色取自 calendar.tex / gen_weekly.py 的品牌色
   ========================================================== */
:root{
  --paper:#ffffff;
  --ground:#eef0f3;
  --soft:#f3f4f6;
  --ink:#1a1d21;
  --ink-2:#4d555f;
  --ink-3:#828a96;
  --rule:#c8ccd2;
  --rule-2:#e4e7eb;

  --uni:#1f497d;            /* 藍 — brandink */
  --uni-fill:#22508a;
  --work:#006a3c;           /* 綠 — brandmain */
  --work-fill:#007542;
  --amber:#b0560a;          /* 橙 — brandaccent（實色版，白字先睇得清） */
  --amber-fill:#b0560a;
  --slate:#666f7c;          /* 灰 — restcol */
  --slate-fill:#666f7c;

  --open:#d66c14;           /* 可排課空檔 */
  --open-soft:#fbf0e4;
  --open-line:#e2a76e;
  --open-ink:#96490a;

  --rest:#828a96;
  --warn-soft:#fdf3e3;
  --danger:#a3342a;

  --shadow:0 1px 2px rgba(26,29,33,.06), 0 10px 28px -14px rgba(26,29,33,.28);

  --hour-h:56px;
  --gutter-w:58px;
  --radius:6px;

  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",ui-sans-serif,system-ui,sans-serif;
  --serif:"Noto Serif TC","PingFang TC",Georgia,serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;

  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#16191c;
    --ground:#0e1114;
    --soft:#1c2024;
    --ink:#e6eaef;
    --ink-2:#a6aeb8;
    --ink-3:#7b838e;
    --rule:#2d333a;
    --rule-2:#24292e;

    --uni:#7ba6dd;
    --uni-fill:#2a5b96;
    --work:#4fb083;
    --work-fill:#0a7a4c;
    --amber:#d99050;
    --amber-fill:#9c4d08;
    --slate:#98a1ad;
    --slate-fill:#4d5661;

    --open:#e59650;
    --open-soft:#2c1f12;
    --open-line:#7a4f1f;
    --open-ink:#f0bd85;

    --rest:#6f7783;
    --warn-soft:#2a2114;
    --danger:#e08a7a;

    --shadow:0 1px 2px rgba(0,0,0,.55), 0 10px 28px -14px rgba(0,0,0,.75);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#16191c;
  --ground:#0e1114;
  --soft:#1c2024;
  --ink:#e6eaef;
  --ink-2:#a6aeb8;
  --ink-3:#7b838e;
  --rule:#2d333a;
  --rule-2:#24292e;

  --uni:#7ba6dd;
  --uni-fill:#2a5b96;
  --work:#4fb083;
  --work-fill:#0a7a4c;
  --amber:#d99050;
  --amber-fill:#9c4d08;
  --slate:#98a1ad;
  --slate-fill:#4d5661;

  --open:#e59650;
  --open-soft:#2c1f12;
  --open-line:#7a4f1f;
  --open-ink:#f0bd85;

  --rest:#6f7783;
  --warn-soft:#2a2114;
  --danger:#e08a7a;

  --shadow:0 1px 2px rgba(0,0,0,.55), 0 10px 28px -14px rgba(0,0,0,.75);
  color-scheme:dark;
}

*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:var(--sans); font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
  display:flex; flex-direction:column; overflow:hidden;
}
button,input,select,textarea{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--open); outline-offset:2px; border-radius:4px}
@media (prefers-reduced-motion: reduce){ *{animation:none !important; transition:none !important} }

/* ---------- 頁首 ---------- */
.topbar{
  display:flex; align-items:center; gap:16px; flex-wrap:wrap;
  padding:11px 18px 10px; background:var(--paper);
  border-bottom:3px solid var(--work); flex:0 0 auto;
}
.brand{display:flex; flex-direction:column; gap:1px; margin-right:auto; min-width:0}
.brand h1{
  font-family:var(--serif); font-weight:700; font-size:19px; margin:0; line-height:1.25;
  color:var(--uni); letter-spacing:.01em;
}
.brand .sub{font-size:11.5px; color:var(--work); font-weight:500}
.owner-tag{
  font-family:var(--mono); font-size:9.5px; letter-spacing:.08em; text-transform:uppercase;
  color:var(--open); border:1px solid var(--open-line); background:var(--open-soft);
  padding:1px 6px; border-radius:3px; margin-left:8px; vertical-align:3px;
}
.cluster{display:flex; align-items:center; gap:8px}

.seg{display:flex; background:var(--soft); border-radius:var(--radius); padding:2px; gap:2px}
.seg button{
  border:0; background:transparent; color:var(--ink-2); cursor:pointer;
  padding:5px 14px; border-radius:4px; font-size:13px; font-weight:500;
}
.seg button[aria-pressed="true"]{background:var(--paper); color:var(--uni); font-weight:700; box-shadow:0 1px 2px rgba(26,29,33,.12)}

.icobtn{
  border:1px solid var(--rule); background:var(--paper); color:var(--ink-2);
  width:31px; height:31px; border-radius:var(--radius); cursor:pointer;
  display:grid; place-items:center; padding:0;
}
.icobtn:hover{background:var(--soft); border-color:var(--ink-3)}
.icobtn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

.tbtn{
  border:1px solid var(--rule); background:var(--paper); color:var(--ink);
  padding:5px 12px; border-radius:var(--radius); cursor:pointer; font-size:13px; font-weight:500;
}
.tbtn:hover{background:var(--soft); border-color:var(--ink-3)}
.tbtn.ghost{border-color:transparent; background:transparent; color:var(--ink-2)}
.tbtn.ghost:hover{background:var(--soft); color:var(--ink)}

.pbtn{
  border:1px solid var(--work); background:var(--work-fill); color:#fff;
  padding:6px 15px; border-radius:var(--radius); cursor:pointer;
  font-size:13px; font-weight:700; display:inline-flex; align-items:center; gap:6px;
}
.pbtn:hover{filter:brightness(1.12)}
.pbtn svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round}

/* ---------- 期間列 ---------- */
.periodbar{
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  padding:8px 18px; background:var(--paper); border-bottom:1px solid var(--rule); flex:0 0 auto;
}
#periodLabel{font-size:15px; font-weight:700; margin:0; color:var(--ink); white-space:nowrap}
.legend{display:flex; gap:13px; align-items:center; margin-left:auto; flex-wrap:wrap}
.key{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; color:var(--ink-2)}
.sw{width:11px; height:11px; border-radius:2px; flex:0 0 auto}
.sw.c-uni{background:var(--uni-fill)}
.sw.c-work{background:var(--work-fill)}
.sw.c-amber{background:var(--amber-fill)}
.sw.c-slate{background:var(--slate-fill)}
.sw.c-open{background:var(--open-soft); border:1.5px dashed var(--open)}
.sw.o{background:var(--open-soft); border:1.5px dashed var(--open)}
.sw.r{background:var(--rest)}

/* ---------- 主區 ---------- */
main{flex:1 1 auto; min-height:0; position:relative; overflow:hidden}
.view{position:absolute; inset:0; display:flex; flex-direction:column}
.view[hidden]{display:none}

/* ---------- 月曆 ---------- */
#monthView{background:var(--paper); overflow:auto}
.mdow{
  display:grid; grid-template-columns:repeat(7,minmax(0,1fr));
  border-bottom:2px solid var(--rule); position:sticky; top:0; background:var(--paper); z-index:3;
}
.mdow div{padding:6px 9px; font-size:11.5px; font-weight:700; color:var(--uni)}
.mdow div.off{color:var(--rest)}
.mgrid{display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); grid-auto-rows:minmax(102px,1fr); flex:1 1 auto}
.mcell{
  border-right:1px solid var(--rule-2); border-bottom:1px solid var(--rule-2);
  padding:4px 5px 6px; min-width:0; display:flex; flex-direction:column; gap:3px;
  cursor:pointer; position:relative;
}
.mcell:nth-child(7n){border-right:0}
.mcell:hover{background:var(--soft)}
.mcell.closed{background:var(--soft)}
.mcell.out{background:var(--ground)}
.mcell.out .dnum{opacity:.45}
.dtop{display:flex; align-items:baseline; gap:5px}
.dnum{
  font-family:var(--mono); font-size:12.5px; color:var(--ink-2); font-weight:500;
  min-width:22px; height:20px; display:grid; place-items:center; border-radius:4px;
  font-variant-numeric:tabular-nums;
}
.mcell.today .dnum{background:var(--uni); color:#fff}
.holi{font-size:10px; color:var(--open); font-weight:700; margin-left:auto; text-align:right; line-height:1.25}
.chips{display:flex; flex-direction:column; gap:2px; min-width:0; overflow:hidden}
.chip{
  display:flex; gap:5px; align-items:baseline; min-width:0; border:0;
  font-size:11.5px; padding:2px 5px; border-radius:3px; cursor:pointer; text-align:left;
  background:var(--work-fill); color:#fff;
}
.chip.c-uni{background:var(--uni-fill)}
.chip.c-work{background:var(--work-fill)}
.chip.c-amber{background:var(--amber-fill)}
.chip.c-slate{background:var(--slate-fill)}
.chip.c-open{background:var(--open-soft); color:var(--open-ink); border:1px dashed var(--open)}
.chip.tentative{background:var(--open-soft); color:var(--open-ink); border:1px dashed var(--open)}
.chip:hover{filter:brightness(1.14)}
.chip time{font-family:var(--mono); font-size:10px; opacity:.85; flex:0 0 auto; font-variant-numeric:tabular-nums}
.chip span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.freeline{
  font-size:10.5px; color:var(--open); font-weight:500; padding:1px 4px; border-radius:3px;
  background:var(--open-soft); border:1px dashed var(--open-line); text-align:left;
  cursor:pointer; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.more{font-size:10.5px; color:var(--ink-3); background:none; border:0; padding:1px 4px; cursor:pointer; text-align:left; font-family:var(--mono)}
.more:hover{color:var(--open); text-decoration:underline}

/* ---------- 週表 ---------- */
#weekView{background:var(--paper)}
.whead{
  display:grid; grid-template-columns:var(--gutter-w) repeat(7,minmax(88px,1fr));
  border-bottom:2px solid var(--rule); flex:0 0 auto;
}
.whead .corner{
  border-right:1px solid var(--rule-2); display:flex; align-items:flex-end; justify-content:flex-end;
  padding:0 7px 6px 0;
}
.whead .corner span{font-family:var(--mono); font-size:9.5px; color:var(--ink-3); white-space:nowrap}
.dhead{
  padding:5px 7px 6px; border-right:1px solid var(--rule-2); min-width:0;
  display:flex; flex-direction:column; gap:0; cursor:pointer; text-align:center;
}
.dhead:last-child{border-right:0}
.dhead:hover{background:var(--soft)}
.dhead .dw{font-size:12.5px; font-weight:700; color:var(--uni)}
.dhead .dw em{font-family:var(--mono); font-size:9px; font-style:normal; opacity:.65; margin-left:3px}
.dhead.closed .dw{color:var(--rest)}
.dhead .dd{font-family:var(--mono); font-size:15px; font-variant-numeric:tabular-nums; line-height:1.2}
.dhead.today .dd{color:var(--open); font-weight:700}

.wscroll{flex:1 1 auto; overflow:auto; position:relative; display:flex; flex-direction:column}
.wgrid{
  display:grid; grid-template-columns:var(--gutter-w) repeat(7,minmax(88px,1fr));
  flex:1 0 auto; min-height:calc(var(--hour-h) * var(--win-hours,15)); position:relative;
}
.gutter{border-right:1px solid var(--rule-2); position:relative}
.gutter .hl{
  position:absolute; right:7px; transform:translateY(-50%);
  font-family:var(--mono); font-size:10.5px; color:var(--uni); font-weight:500;
  font-variant-numeric:tabular-nums; white-space:nowrap;
}
.gutter .hl.last{transform:translateY(-100%)}
.dcol{
  position:relative; border-right:1px solid var(--rule-2); min-width:0;
  --hstep:calc(100% / var(--win-hours,15));
  background-image:repeating-linear-gradient(to bottom,
    var(--rule) 0, var(--rule) 1px, transparent 1px, transparent var(--hstep));
}
.dcol::after{
  content:""; position:absolute; inset:0; pointer-events:none;
  background-image:repeating-linear-gradient(to bottom,
    transparent 0, transparent calc(var(--hstep)/2 - 1px),
    var(--rule-2) calc(var(--hstep)/2 - 1px), var(--rule-2) calc(var(--hstep)/2),
    transparent calc(var(--hstep)/2), transparent var(--hstep));
}
.dcol:last-child{border-right:0}
.dcol.closed{background-color:var(--soft)}
.locked{
  position:absolute; left:0; right:0; z-index:1; cursor:not-allowed;
  background:repeating-linear-gradient(45deg,
    transparent 0, transparent 5px,
    color-mix(in srgb, var(--rest) 26%, transparent) 5px,
    color-mix(in srgb, var(--rest) 26%, transparent) 10px);
  border-top:1px solid var(--rule);
  display:flex; align-items:flex-start; justify-content:center; padding-top:5px;
}
.locked span{
  font-size:9.5px; color:var(--ink-3); background:var(--paper);
  padding:1px 6px; border-radius:9px; border:1px solid var(--rule); white-space:nowrap;
}

.ev{
  position:absolute; border-radius:4px; padding:3px 5px; overflow:hidden;
  cursor:pointer; text-align:center; font-size:11.5px; line-height:1.3;
  display:flex; flex-direction:column; justify-content:center; align-items:center; gap:1px;
  background:var(--work-fill); color:#fff; border:1px solid rgba(0,0,0,.16);
}
.ev.c-uni{background:var(--uni-fill)}
.ev.c-work{background:var(--work-fill)}
.ev.c-amber{background:var(--amber-fill)}
.ev.c-slate{background:var(--slate-fill)}
.ev.c-open{
  background:var(--open-soft); color:var(--open-ink);
  border:1.5px dashed var(--open);
}
.ev.c-open:hover{background:var(--open); color:#fff; border-style:solid; filter:none}
.ev.pending{border:2px dashed rgba(255,255,255,.7)}
.ev b{font-weight:700; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.ev time{font-family:var(--mono); font-size:9.5px; opacity:.88; font-variant-numeric:tabular-nums}
.ev .rm{font-size:9.5px; opacity:.82; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.ev:hover{filter:brightness(1.15); z-index:6}
.ev.short{flex-direction:row; gap:5px; padding:1px 5px}
.ev.once::before{
  content:"單次"; position:absolute; top:2px; right:3px;
  font-size:8px; background:rgba(255,255,255,.28); padding:0 3px; border-radius:2px;
}

.slot{
  position:absolute; border-radius:4px; padding:3px 4px; overflow:hidden; cursor:pointer;
  background:var(--open-soft); border:1.5px dashed var(--open); color:var(--open-ink);
  display:flex; flex-direction:column; justify-content:center; align-items:center; gap:1px;
  text-align:center; font-size:11px; line-height:1.3;
}
.slot b{font-weight:700; font-size:12px}
.slot time{font-family:var(--mono); font-size:10px; font-weight:500; font-variant-numeric:tabular-nums}
.slot .hrs{font-size:9.5px; opacity:.8}
.slot:hover{background:var(--open); color:#fff; border-style:solid}
.slot.tiny{padding:1px 3px}
.slot.tiny .hrs, .slot.tiny b{display:none}

.restday{
  position:absolute; inset:0; display:flex; flex-direction:column; align-items:center;
  justify-content:center; gap:3px; color:var(--rest); pointer-events:none; text-align:center;
  z-index:2;
}
.restday b{font-size:13px; font-weight:700}
.restday span{font-size:10.5px}

.ghost-sel{
  position:absolute; left:2px; right:2px; border-radius:4px; pointer-events:none;
  background:var(--open-soft); border:1.5px dashed var(--open); z-index:7;
  display:flex; align-items:center; justify-content:center;
  font-family:var(--mono); font-size:10.5px; color:var(--open-ink); font-variant-numeric:tabular-nums;
}
.nowline{position:absolute; left:0; right:0; height:0; border-top:1.5px solid var(--open); z-index:8; pointer-events:none}
.nowline::before{content:""; position:absolute; left:-4px; top:-4px; width:7px; height:7px; border-radius:50%; background:var(--open)}
.nowlabel{
  position:absolute; right:6px; transform:translateY(-50%); z-index:9; pointer-events:none;
  font-family:var(--mono); font-size:9.5px; color:#fff; background:var(--open);
  padding:0 4px; border-radius:3px; font-variant-numeric:tabular-nums;
}

/* ---------- 頁尾 ---------- */
.foot{
  display:flex; gap:12px; align-items:center; flex-wrap:wrap;
  padding:6px 18px; background:var(--paper); border-top:1px solid var(--rule);
  font-size:10.5px; color:var(--ink-3); flex:0 0 auto;
}
.foot .mid{margin:0 auto}

/* ---------- 彈出視窗 ---------- */
.backdrop{position:fixed; inset:0; background:rgba(14,17,20,.45); z-index:40; opacity:0; pointer-events:none; transition:opacity .16s}
.backdrop.on{opacity:1; pointer-events:auto}
.sheet{
  position:fixed; z-index:41; background:var(--paper); box-shadow:var(--shadow);
  left:50%; top:50%; transform:translate(-50%,-46%) scale(.97);
  width:min(400px, calc(100vw - 28px)); max-height:min(88vh, 780px);
  border-radius:12px; border:1px solid var(--rule);
  display:flex; flex-direction:column; opacity:0; pointer-events:none;
  transition:opacity .16s, transform .16s cubic-bezier(.4,0,.2,1);
}
.sheet.on{opacity:1; pointer-events:auto; transform:translate(-50%,-50%) scale(1)}
.sheet header{display:flex; align-items:center; gap:10px; padding:14px 16px 11px; border-bottom:1px solid var(--rule-2)}
.sheet header h2{font-family:var(--serif); font-size:17px; font-weight:700; margin:0; margin-right:auto; color:var(--uni)}
.sheet form{padding:15px 16px 16px; overflow:auto; display:flex; flex-direction:column; gap:12px; flex:1 1 auto}
.field{display:flex; flex-direction:column; gap:4px}
.field > label{font-size:11.5px; font-weight:700; color:var(--ink-2)}
.field input, .field textarea, .field select{
  width:100%; padding:9px 10px; border:1px solid var(--rule); border-radius:var(--radius);
  background:var(--soft); color:var(--ink); font-size:14px;
}
.field input:focus, .field textarea:focus, .field select:focus{outline:none; border-color:var(--work); background:var(--paper)}
#fTitle{font-size:15.5px; font-weight:500}
#fTitle:read-only{
  background:var(--open-soft); border-color:var(--open-line); color:var(--open-ink);
  font-weight:700; cursor:default;
}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:9px; align-items:end}
input[type="time"]{font-family:var(--mono); font-variant-numeric:tabular-nums}
.durline{font-family:var(--mono); font-size:11px; color:var(--ink-3)}

.repeat{
  display:flex; align-items:flex-start; gap:9px; padding:10px 11px;
  border:1px solid var(--work); background:color-mix(in srgb, var(--work) 9%, transparent);
  border-radius:var(--radius); cursor:pointer;
}
.repeat.off{border-color:var(--rule); background:var(--soft)}
.repeat input{margin:2px 0 0; accent-color:var(--work); width:16px; height:16px; flex:0 0 auto}
.repeat .txt{display:flex; flex-direction:column; gap:1px; min-width:0}
.repeat b{font-size:13px; font-weight:700}
.repeat small{font-size:11px; color:var(--ink-2); line-height:1.4}

.kinds{display:grid; grid-template-columns:1fr 1fr; gap:7px}
.kinds label{
  position:relative;
  display:flex; align-items:center; gap:7px; cursor:pointer; min-width:0;
  border:1px solid var(--rule); border-radius:var(--radius); padding:8px 9px; font-size:12.5px; font-weight:500;
}
.kinds label span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.kinds input{position:absolute; inset:0; width:100%; height:100%; opacity:0; margin:0; cursor:pointer}
.kinds label:has(input:checked){font-weight:700}
.kinds label.c-uni:has(input:checked){border-color:var(--uni); background:color-mix(in srgb, var(--uni) 13%, transparent); color:var(--uni)}
.kinds label.c-work:has(input:checked){border-color:var(--work); background:color-mix(in srgb, var(--work) 13%, transparent); color:var(--work)}
.kinds label.c-amber:has(input:checked){border-color:var(--amber); background:color-mix(in srgb, var(--amber) 13%, transparent); color:var(--amber)}
.kinds label.c-slate:has(input:checked){border-color:var(--slate); background:color-mix(in srgb, var(--slate) 15%, transparent); color:var(--slate)}
.kinds label.c-open:has(input:checked){border-color:var(--open); background:var(--open-soft); color:var(--open-ink)}
.kinds label:has(input:focus-visible){outline:2px solid var(--open); outline-offset:2px}
.dot{width:12px; height:12px; border-radius:3px; flex:0 0 auto}
.dot.c-uni{background:var(--uni-fill)}
.dot.c-work{background:var(--work-fill)}
.dot.c-amber{background:var(--amber-fill)}
.dot.c-slate{background:var(--slate-fill)}

<script>
window.CALENDAR_CONFIG = {

  title: "每週固定時間表",
  subtitle: "港大課堂 × 新東方教學 ・ 可排課空檔一覽",
  footNote: "新東方 ・ 前途出國",
  copyright: "© By Bosco Fung, All rights reserved",

  // 加 #你的密語 在網址最尾就進入管理模式（可改／刪任何課堂）。
  // 分享網址之前務必改成只有你知道的字。
  ownerKey: "owner",

  // 週表格線顯示嘅時間範圍
  dayStart: "08:00",
  dayEnd:   "23:00",

  // 自動計「可排課空檔」嘅範圍。格線照樣由 dayStart 畫到 dayEnd，
  // 但空檔只會喺呢個範圍內出現 —— 即係唔會叫人朝早 8 點或者夜晚 9 點後上堂。
  // （同你 gen_weekly.py 嘅 T0, T1 = 9, 21 一樣）
  bookableFrom: "09:00",
  bookableTo:   "21:00",

  // 顏色分類 —— 加減／改名／換色都喺呢度。
  //   key    : 存落資料庫嘅代號，改咗舊資料就對唔上，最好唔好郁
  //   label  : 彈出視窗同圖例顯示嘅名
  //   colour : uni(藍) / work(綠) / amber(橙) / open(橙色半透明) / slate(灰)
  //   locked : true = 只有管理模式先刪得（訪客照樣改得）
  //   travel : true = 呢類課堂前後要預留交通時間（本來只有港大課堂先要）
  //   fixedTitle : 有呢個就會鎖死個名，用家改唔到（可排課就係咁）
  categories: [
    { key: "uni",   label: "港大課堂",    colour: "uni",   travel: true, locked: true },  // locked = 只有管理模式先刪得
    { key: "work",  label: "新東方教學",  colour: "work",  travel: false },
    { key: "other", label: "其他 / 私人", colour: "amber", travel: false },
    { key: "open",  label: "可排課",      colour: "open",  travel: false, fixedTitle: "可排課" }
  ],

  // 學生預約時預設用邊個分類
  defaultCategory: "work",

  // ---- 課堂類型（同顏色分類係兩回事）------------------------------------
  // 顏色 = 睇落點樣；類型 = 邊間機構／邊種學生，用嚟計錢。
  // 所有人都揀得、改得類型；但時薪同銀碼只有管理模式先睇到。
  //
  // ⚠️ 時薪唔喺呢度寫。呢個檔案會放上公開 GitHub repo，寫喺度等於公開你嘅收費。
  //    時薪喺網頁嘅「收費」面板入面設定，只會存喺你自己部機（localStorage），
  //    唔會上載到 GitHub，亦唔會入 Firebase。換部機就要再設定一次。
  lessonTypes: [
    { key: "lighthouse", label: "燈塔" },
    { key: "primary",    label: "中小" },
    { key: "sail",       label: "揚帆班課" }
  ],
  currency: "HK$",

  // 呢個日期之前嘅課堂唔會顯示（資料仲喺 Firebase，只係唔畫出嚟）
  hideBefore: "2026-09-01",


  // 交通緩衝：travel:true 嘅課堂前後要扣幾多分鐘（0 = 不扣）
  travelBuffer: 30,
  // 短過幾多分鐘就不當作可排課
  minSlot: 60,

  // 邊幾日開放收新課。索引 0=星期一 … 6=星期日
  // 而家全部日子都開放：所有冇課、又冇封鎖嘅時間都會自動變「可排課」。
  // 想成日唔收新課就把嗰日改返 false。
  openDays: [true, true, true, true, true, true, true],

  // 某日只開放部分時段。填咗嘅日子就淨係嗰幾段有可排課，其餘時間唔會出。
  // 空 {} = 唔限制，全日跟 lockedWindows 同 bookableFrom/To 計。
  // 例：{ 2: [["09:30", "11:30"]] } 代表星期三只開 09:30–11:30。
  extraWindows: {},

  // 封鎖時段：呢啲時間任何人都預約唔到，格線上會打斜紋。
  // 索引 0=星期一 … 6=星期日。管理模式唔受限制（自己張表自己話事）。
  lockedWindows: {
    2: [["17:00", "23:00"]],   // 星期三 夜晚唔開放
    5: [["18:00", "23:00"]],   // 星期六 夜晚唔開放
    6: [["08:00", "23:00"]]    // 星期日 全日唔開放
  },

  // 假期／特別日子：格仔會標示，當日不計可排課
  holidays: {
    "2026-09-25": "中秋節",
    "2026-09-26": "中秋節翌日"
  },

  firebase: {

    messagingSenderId: "940059203418",
    appId: "1:940059203418:web:de4a33b7bb3c7e46e08563"
  }
};
</script>

<script>
"use strict";

const CFG = Object.assign({
  title: "每週固定時間表", subtitle: "", footNote: "", copyright: "",
  ownerKey: "owner", dayStart: "08:00", dayEnd: "23:00",
  bookableFrom: null, bookableTo: null,
  categories: [
    { key: "uni",  label: "港大課堂",   colour: "uni",  travel: true  },
    { key: "work", label: "新東方教學", colour: "work", travel: false }
  ],
  defaultCategory: "work",
  lessonTypes: [], currency: "HK$", hideBefore: "",
  travelBuffer: 30, minSlot: 60,
  openDays: [true, true, true, true, true, false, false],
  extraWindows: {}, lockedWindows: {}, holidays: {}, firebase: null
}, window.CALENDAR_CONFIG || {});

const IS_OWNER = location.hash.replace(/^#/, "") === CFG.ownerKey;

/* ---------------------------------------------------------------
   時間 / 日期小工具
   --------------------------------------------------------------- */
const pad = n => String(n).padStart(2, "0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseYmd = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const c = new Date(d); c.setDate(c.getDate() + n); return c; };
const sameDay = (a, b) => ymd(a) === ymd(b);
const toMin = t => { const [h, m] = String(t).split(":").map(Number); return h * 60 + m; };
const toHHMM = m => `${pad(Math.floor(m / 60))}:${pad(Math.round(m) % 60)}`;
const fmt = m => toHHMM(m);
const fmtRange = (a, b) => `${fmt(a)}–${fmt(b)}`;
const hrs = m => (Math.round((m / 60) * 100) / 100).toString();

/* 星期一 = 0，同 gen_weekly.py 的 E 字典一致 */
const dowOf = d => (d.getDay() + 6) % 7;
const startOfWeek = d => { const c = new Date(d); c.setHours(0,0,0,0); return addDays(c, -dowOf(c)); };

const DOW_ZH = ["星期一","星期二","星期三","星期四","星期五","星期六","星期日"];
const DOW_EN = ["MON","TUE","WED","THU","FRI","SAT","SUN"];

const WIN_A = toMin(CFG.dayStart);
const WIN_B = toMin(CFG.dayEnd);
const WIN   = WIN_B - WIN_A;
const HOURS = Math.round(WIN / 60);
const pct = m => ((m - WIN_A) / WIN) * 100;
const inWindow = m => m >= WIN_A && m <= WIN_B;

/* 自動空檔嘅範圍，冇設定就跟返格線範圍 */
const BOOK_A = Math.max(WIN_A, CFG.bookableFrom ? toMin(CFG.bookableFrom) : WIN_A);
const BOOK_B = Math.min(WIN_B, CFG.bookableTo   ? toMin(CFG.bookableTo)   : WIN_B);

/* ---- 顏色分類 ---- */
const CATS = (CFG.categories || []).filter(c => c && c.key);
const CAT_BY = Object.fromEntries(CATS.map(c => [c.key, c]));
const DEFAULT_CAT = CAT_BY[CFG.defaultCategory] ? CFG.defaultCategory : (CATS[0] || {}).key;
/* 舊資料或者已刪走嘅分類 → 落返預設，唔好變透明格 */
const catOf = k => CAT_BY[k] || CAT_BY[DEFAULT_CAT] || { key: "", label: "", colour: "work", travel: false };
const colourOf = k => "c-" + catOf(k).colour;

/* ---- 課堂類型（公開）同時薪（只存喺owner部機）---- */
const TYPES = (CFG.lessonTypes || []).filter(t => t && t.key);
const TYPE_BY = Object.fromEntries(TYPES.map(t => [t.key, t]));
const typeLabel = k => (TYPE_BY[k] || {}).label || "";

const RATE_KEY = "timetable.rates.v1";
let RATES = {};
try { RATES = JSON.parse(localStorage.getItem(RATE_KEY) || "{}") || {}; } catch {}
const rateOf = k => Number(RATES[k]) || 0;
function saveRates() { try { localStorage.setItem(RATE_KEY, JSON.stringify(RATES)); } catch {} }
const ratesSet = () => TYPES.some(t => rateOf(t.key) > 0);

/* 一堂課值幾多錢。冇類型或者冇設時薪 = 0 */
const feeOf = e => ((e.end - e.start) / 60) * rateOf(e.ltype);
const money = v => CFG.currency + Math.round(v).toLocaleString("en-US");

const isOpenDay = dow => !!CFG.openDays[dow];
const windowsFor = dow => (CFG.extraWindows[dow] || []).map(w => [toMin(w[0]), toMin(w[1])]);
const holidayOn = key => CFG.holidays[key] || null;
const lockedFor = dow => (CFG.lockedWindows[dow] || []).map(w => [toMin(w[0]), toMin(w[1])]);
/* 由 a 到 b 有冇撞到封鎖時段？撞到就回傳嗰一格，冇就 null */
const lockHit = (dow, a, b) => lockedFor(dow).find(([x, y]) => x < b && a < y) || null;

/* ---------------------------------------------------------------
   預設課堂表 — 直接由 gen_weekly.py 的 E 字典搬過嚟
   dow：0=星期一 … 6=星期日；時間用分鐘
   --------------------------------------------------------------- */
function defaultTimetable() {
  const T = (h, m) => h * 60 + (m || 0);
  const rows = [
    [0, T(12),    T(12,50), "uni",  "FINA 4354",      "KKLG110"],
    [0, T(15),    T(17),    "work", "李子敬 1v1",      "ACCT1101"],
    [0, T(17),    T(18),    "work", "揚帆班課",        ""],
    [0, T(18),    T(20),    "work", "來晏如 1v1",      ""],

    [1, T(9),     T(11,50), "uni",  "STAT 4601",      "MWT2"],
    [1, T(13),    T(14,50), "uni",  "FINA 2390",      "KK101"],
    [1, T(17),    T(19),    "work", "陳子洋 1v1",      ""],
    [1, T(19),    T(21),    "work", "周子揚 1v1",      ""],

    [2, T(9,30),  T(11,30), "work", "盛涵宇 1v1",      ""],
    [2, T(12),    T(12,50), "uni",  "FINA 2390",      "KK101"],
    [2, T(13),    T(13,50), "uni",  "STAT 4601 導修",  "CPD2.37"],
    [2, T(17),    T(19),    "work", "揚帆班課",        ""],

    [3, T(12,30), T(14,30), "work", "黃歆茹 1v1",      ""],
    [3, T(14,30), T(16,30), "work", "李子敬 1v1",      "ECON1210"],
    [3, T(17),    T(18,50), "uni",  "FINA 4354",      "KKLG110"],
    [3, T(19),    T(21),    "work", "徐詩雅 1v1",      ""],

    [4, T(10),    T(10,50), "uni",  "FINA 2390 導修",  "KK1104"],
    [4, T(17),    T(19),    "work", "揚帆班課",        ""],
    [4, T(19),    T(21),    "work", "周子揚 1v1",      ""],

    [5, T(10),    T(12),    "work", "揚帆班課",        ""],
    [5, T(13),    T(15),    "work", "揚帆班課",        ""],
    [5, T(15),    T(17),    "work", "揚帆自習＋Michael 1v1", "可延至 18:00"]
  ];
  return rows.map((r, i) => ({
    id: "base" + i, dow: r[0], start: r[1], end: r[2], kind: r[3],
    title: r[4], note: r[5], who: "", repeat: true, skip: [],
    ltype: r[4].indexOf("揚帆") === 0 ? "sail" : "",
    status: "busy", createdAt: Date.now()
  }));
}

/* ---------------------------------------------------------------
   儲存 — 有 Firebase 就用 Firebase，否則存在本機瀏覽器
   --------------------------------------------------------------- */
const Store = (() => {
  let events = [], onChange = () => {}, mode = "local", fs = null, seeded = false;
  const LS = "timetable.events.v2", MINE = "timetable.mine.v2";

  const readLocal = () => { try { return JSON.parse(localStorage.getItem(LS) || "null"); } catch { return null; } };
  const writeLocal = v => { try { localStorage.setItem(LS, JSON.stringify(v)); } catch {} };
  let mine = (() => { try { return new Set(JSON.parse(localStorage.getItem(MINE) || "[]")); } catch { return new Set(); } })();
  const remember = id => { mine.add(id); try { localStorage.setItem(MINE, JSON.stringify([...mine])); } catch {} };
  const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

  async function initFirebase(cfg) {
    const base = "https://www.gstatic.com/firebasejs/10.12.2/";
    const { initializeApp } = await import(base + "firebase-app.js");
    const api = await import(base + "firebase-firestore.js");
    const db = api.getFirestore(initializeApp(cfg));
    fs = { db, api }; mode = "firebase";

    api.onSnapshot(api.collection(db, "lessons"),
      async snap => {
        events = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        // 資料庫係空嘅（第一次用）→ 把預設時間表寫上去，只做一次
        if (!events.length && !snap.metadata.fromCache && !seeded) {
          seeded = true;
          try {
            for (const e of defaultTimetable()) {
              const b = { ...e }; delete b.id; delete b.skip;
              b.skip = [];
              const ref = await api.addDoc(api.collection(db, "lessons"), b);
              remember(ref.id);
            }
          } catch (err) { console.error("[timetable] 寫入預設時間表失敗:", err); banner("寫入預設時間表失敗，請檢查 Firestore 規則。"); }
          return;                      // onSnapshot 會再叫一次
        }
        onChange();
      },
      err => { console.error("[timetable]", err); banner("暫時連唔到資料庫，顯示緊上次載入嘅內容。" + (err.code || "")); });
  }

  return {
    get mode() { return mode; },
    all() { return events; },
    isMine(id) { return mine.has(id); },
    async init(cb) {
      onChange = cb;
      if (CFG.firebase && CFG.firebase.projectId) {
        try { await initFirebase(CFG.firebase); return; }
        catch (e) { console.error("[timetable] Firebase 載入失敗:", e); banner("連唔到 Firebase，課堂暫時只存喺你自己部機。"); }
      }
      const stored = readLocal();
      events = stored === null ? defaultTimetable() : stored;
      if (stored === null) { writeLocal(events); events.forEach(e => remember(e.id)); }
      onChange();
      if (!CFG.firebase) banner("課堂只儲存喺你自己部瀏覽器，其他人睇唔到。接駁 Firebase 之後先會共用。");
    },
    async save(ev) {
      if (mode === "firebase") {
        const { api, db } = fs, body = { ...ev }; delete body.id;
        if (ev.id) { await api.setDoc(api.doc(db, "lessons", ev.id), body); return ev.id; }
        const ref = await api.addDoc(api.collection(db, "lessons"), body);
        remember(ref.id); return ref.id;
      }
      if (ev.id) { const i = events.findIndex(e => e.id === ev.id); if (i > -1) events[i] = { ...ev }; }
      else { ev = { ...ev, id: newId() }; events.push(ev); remember(ev.id); }
      writeLocal(events); onChange(); return ev.id;
    },
    async remove(id) {
      if (mode === "firebase") { await fs.api.deleteDoc(fs.api.doc(fs.db, "lessons", id)); return; }
      events = events.filter(e => e.id !== id); writeLocal(events); onChange();
    }
  };
})();

function banner(text) {
  document.getElementById("bannerText").textContent = text;
  document.getElementById("banner").hidden = false;
}
document.getElementById("bannerX").onclick = () => { document.getElementById("banner").hidden = true; };

/* ---------------------------------------------------------------
   把「每週重複」展開成某一日嘅課堂
   --------------------------------------------------------------- */
function lessonsOn(date) {
  const key = ymd(date), dow = dowOf(date);
  if (CFG.hideBefore && key < CFG.hideBefore) return [];
  return Store.all().filter(e => {
    if (!e) return false;
    if (!e.repeat) return e.date === key;
    if (e.dow !== dow) return false;
    if (e.from  && key < e.from)  return false;   // 開始之前唔出現 —— 唔會補返以前嗰啲星期
    if (e.until && key > e.until) return false;   // 「刪除呢次同之後」之後就到此為止
    return !(e.skip || []).includes(key);
  }).sort((a, b) => a.start - b.start || a.end - b.end);
}

/* 可排課空檔 — 演算法照搬 gen_weekly.py 的 free_slots() */
function freeSlots(date) {
  const dow = dowOf(date), key = ymd(date);
  if (holidayOn(key)) return [];
  const wins = windowsFor(dow);
  if (!isOpenDay(dow) && !wins.length) return [];

  const evs = lessonsOn(date);
  const BUF = CFG.travelBuffer, MIN = CFG.minSlot;
  const up = t => Math.ceil(t / 30) * 30, down = t => Math.floor(t / 30) * 30;

  const gaps = [];
  let cur = WIN_A, pk = null;
  for (const e of evs) {
    if (e.start > cur) gaps.push([cur, e.start, pk, e.kind]);
    if (e.end > cur) { cur = e.end; pk = e.kind; }
  }
  if (cur < WIN_B) gaps.push([cur, WIN_B, pk, null]);

  let out = [];
  for (const [g0, g1, prev, next] of gaps) {
    const a = up(g0 + (prev && catOf(prev).travel ? BUF : 0));
    const b = down(g1 - (next && catOf(next).travel ? BUF : 0));
    if (b - a >= MIN) out.push([a, b]);
  }
  // 剪到可排課範圍之內（例如朝早 8-9 點、夜晚 9-11 點唔出空檔）
  out = out.map(([a, b]) => [Math.max(a, BOOK_A), Math.min(b, BOOK_B)])
           .filter(([a, b]) => b - a >= MIN);

  // 剪走封鎖時段
  for (const [x, y] of lockedFor(dow)) {
    const kept = [];
    for (const [a, b] of out) {
      if (b <= x || a >= y) { kept.push([a, b]); continue; }   // 冇重疊
      if (a < x && x - a >= MIN) kept.push([a, x]);            // 封鎖之前仲有位
      if (y < b && b - y >= MIN) kept.push([y, b]);            // 封鎖之後仲有位
    }
    out = kept;
  }
  if (wins.length) {
    const clipped = [];
    for (const [a, b] of out) for (const [w0, w1] of wins) {
      const lo = Math.max(a, w0), hi = Math.min(b, w1);
      if (hi - lo >= MIN) clipped.push([lo, hi]);
    }
    out = clipped;
  }
  return out;
}

/* ---------------------------------------------------------------
   狀態
   --------------------------------------------------------------- */
const state = { view: "week", cursor: new Date() };
let clearMode = false;
const clearSel = new Set();

/* 用 open 色嘅分類係「空位標記」，唔係一堂課 */
const isOpenMarker = kind => catOf(kind).colour === "open";
/* 嗰段時間有冇一格明擺出嚟嘅「可排課」？有就當開放，封鎖時段唔算數 */
function inOpenMarker(date, a, b) {
  return lessonsOn(date).some(e => isOpenMarker(e.kind) && e.start <= a && b <= e.end);
}
/* 人人都改得任何一堂。唯一限制係刪港大課堂 —— 見 canDelete() */
const canEdit = () => true;
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

/* ---------------------------------------------------------------
   月曆
   --------------------------------------------------------------- */
const mdow = document.getElementById("mdow");
const mgrid = document.getElementById("mgrid");
mdow.innerHTML = DOW_ZH.map((z, i) => `<div class="${isOpenDay(i) ? "" : "off"}">${z}</div>`).join("");

function renderMonth() {
  const cur = state.cursor;
  const first = new Date(cur.getFullYear(), cur.getMonth(), 1);
  const gridStart = startOfWeek(first);
  const last = new Date(cur.getFullYear(), cur.getMonth() + 1, 0);
  const weeks = Math.ceil((Math.round((startOfWeek(last) - gridStart) / 86400000) + 7) / 7);
  const today = new Date();

  let html = "";
  for (let i = 0; i < weeks * 7; i++) {
    const d = addDays(gridStart, i), key = ymd(d), dow = dowOf(d);
    const out = d.getMonth() !== cur.getMonth();
    const holi = holidayOn(key);
    const evs = lessonsOn(d);
    const free = freeSlots(d);
    const chips = evs.slice(0, 3).map(e => `
      <button class="chip ${colourOf(e.kind)} ${e.status === "tentative" ? "tentative" : ""}"
              data-ev="${e.id}" data-on="${key}" type="button"
              title="${esc(catOf(e.kind).label)}：${esc(e.title)}">
        <time>${fmt(e.start)}</time><span>${esc(e.title)}</span>
      </button>`).join("");
    const more = evs.length > 3 ? `<button class="more" data-goweek="${key}" type="button">還有 ${evs.length - 3} 堂</button>` : "";
    const freeTotal = free.reduce((s, [a, b]) => s + (b - a), 0);
    const freeLine = free.length && !out
      ? `<button class="freeline" data-goweek="${key}" type="button">可排課 ${hrs(freeTotal)} 小時</button>` : "";
    const closed = lockedFor(dow).some(([a, b]) => a <= WIN_A && b >= WIN_B)
                || (!isOpenDay(dow) && !windowsFor(dow).length);

    html += `
      <div class="mcell ${out ? "out" : ""} ${closed && !out ? "closed" : ""} ${sameDay(d, today) ? "today" : ""} ${clearSel.has(key) ? "sel" : ""}" data-day="${key}">
        <div class="dtop">
          <span class="dnum">${d.getDate()}</span>
          ${holi ? `<span class="holi">${esc(holi)}</span>` : ""}
          ${IS_OWNER && ratesSet() && !out && dayFee(d).amount
              ? `<span class="cash">${money(dayFee(d).amount)}</span>` : ""}
        </div>
        <div class="chips">${chips}${more}${freeLine}</div>
      </div>`;
  }
  mgrid.innerHTML = html;
  mgrid.style.gridAutoRows = `minmax(${weeks > 5 ? 86 : 102}px, 1fr)`;
}

/* ---------------------------------------------------------------
   週表
   --------------------------------------------------------------- */
const whead = document.getElementById("whead");
const wgrid = document.getElementById("wgrid");
const gutter = document.getElementById("gutter");

const HOUR_MARKS = [];
for (let m = WIN_A + 60; m <= WIN_B; m += 60) HOUR_MARKS.push(m);
gutter.innerHTML = HOUR_MARKS.map((m, i) =>
  `<span class="hl${i === HOUR_MARKS.length - 1 ? " last" : ""}" style="top:${pct(m)}%">${fmt(m)}</span>`).join("");
document.getElementById("winLabel").textContent = `${Math.floor(WIN_A/60)}–${Math.floor(WIN_B/60)}h`;

function layoutColumns(evs) {
  const out = evs.map(e => ({ e, col: 0, cols: 1 }));
  let cluster = [], clusterEnd = -1;
  const flush = () => {
    if (!cluster.length) return;
    const lanes = [];
    for (const it of cluster) {
      let placed = false;
      for (let i = 0; i < lanes.length; i++) if (lanes[i] <= it.e.start) { lanes[i] = it.e.end; it.col = i; placed = true; break; }
      if (!placed) { it.col = lanes.length; lanes.push(it.e.end); }
    }
    for (const it of cluster) it.cols = lanes.length;
    cluster = []; clusterEnd = -1;
  };
  for (const it of out) {
    if (cluster.length && it.e.start >= clusterEnd) flush();
    cluster.push(it); clusterEnd = Math.max(clusterEnd, it.e.end);
  }
  flush();
  return out;
}

function renderWeek() {
  const ws = startOfWeek(state.cursor), today = new Date();

  let head = `<div class="corner"><span>${Math.floor(WIN_A/60)}–${Math.floor(WIN_B/60)}h</span></div>`;
  for (let i = 0; i < 7; i++) {
    const d = addDays(ws, i), key = ymd(d);
    const lk = lockedFor(i);
    const closed = lk.some(([a, bb]) => a <= WIN_A && bb >= WIN_B)
                || (!isOpenDay(i) && !windowsFor(i).length);
    // 標題淨係得星期同日子。開放狀態睇格線，假期喺月曆度睇。
    head += `
      <div class="dhead ${closed ? "closed" : ""} ${sameDay(d, today) ? "today" : ""} ${clearSel.has(key) ? "sel" : ""}" data-goday="${key}">
        <span class="dw">${DOW_ZH[i]}<em>${DOW_EN[i]}</em></span>
        <span class="dd">${d.getDate()}</span>
        ${IS_OWNER && ratesSet() && dayFee(d).amount
            ? `<span class="money">${money(dayFee(d).amount)}</span>` : ""}
      </div>`;
  }
  whead.innerHTML = head;

  let cols = "";
  for (let i = 0; i < 7; i++) {
    const d = addDays(ws, i), key = ymd(d);
    const locks = lockedFor(i);
    // 成日由頭封到尾 = 休息日，畫成灰色
    const fullyLocked = locks.some(([a, bb]) => a <= WIN_A && bb >= WIN_B);
    const closed = fullyLocked || (!isOpenDay(i) && !windowsFor(i).length);
    const evs = lessonsOn(d);
    let inner = "";

    for (const [a, b] of freeSlots(d)) {
      const tiny = (b - a) < 45;   // 太矮先淨係顯示時間
      inner += `
        <button class="slot ${tiny ? "tiny" : ""}" type="button" data-slot="${key}|${a}|${b}"
                title="可排課 ${fmtRange(a, b)}（${hrs(b - a)} 小時）"
                style="top:${pct(a)}%; height:${((b - a) / WIN) * 100}%; left:2px; right:2px;">
          <b>可排課</b><time>${fmtRange(a, b)}</time><span class="hrs">（${hrs(b - a)} 小時）</span>
        </button>`;
    }

    for (const { e, col, cols: n } of layoutColumns(evs)) {
      const vs = Math.max(e.start, WIN_A), ve = Math.min(e.end, WIN_B);
      if (ve <= vs) continue;
      const w = 100 / n, short = (ve - vs) <= 40;
      inner += `
        <button class="ev ${colourOf(e.kind)} ${short ? "short" : ""} ${e.repeat ? "" : "once"} ${e.status === "tentative" ? "pending" : ""}"
                type="button" data-ev="${e.id}" data-on="${key}"
                title="${isOpenMarker(e.kind) && !IS_OWNER
                          ? `可排課 ${fmtRange(e.start, e.end)} —— 撳一下預約`
                          : `${esc(catOf(e.kind).label)}：${esc(e.title)} ${fmtRange(e.start, e.end)}${e.note ? " ・ " + esc(e.note) : ""}`}"
                style="top:${pct(vs)}%; height:${((ve - vs) / WIN) * 100}%; left:calc(${col * w}% + 2px); width:calc(${w}% - 4px); z-index:2;">
          <b>${esc(e.title)}</b><time>${fmtRange(e.start, e.end)}</time>
          ${catOf(e.kind).fixedTitle
              ? (short ? "" : `<span class="rm">（${hrs(ve - vs)} 小時）</span>`)
              : (e.note && !short ? `<span class="rm">${esc(e.note)}</span>` : "")}
        </button>`;
    }

    for (const [a, bb] of locks) {
      const vs = Math.max(a, WIN_A), ve = Math.min(bb, WIN_B);
      if (ve <= vs) continue;
      inner += `<div class="locked" style="top:${pct(vs)}%; height:${((ve - vs) / WIN) * 100}%"
                     title="${fmtRange(vs, ve)} 唔開放預約"><span>唔開放預約</span></div>`;
    }
    if (closed && !evs.length) inner += `<div class="restday"><b>休息日</b><span>溫習 ・ 備課</span></div>`;
    if (sameDay(d, today)) {
      const m = today.getHours() * 60 + today.getMinutes();
      if (inWindow(m)) inner += `<div class="nowline" style="top:${pct(m)}%"></div>`;
    }
    cols += `<div class="dcol ${closed ? "closed" : ""} ${clearSel.has(key) ? "sel" : ""}" data-col="${key}">${inner}</div>`;
  }

  wgrid.style.setProperty("--win-hours", HOURS);
  wgrid.innerHTML = `<div class="gutter">${gutter.innerHTML}</div>` + cols;

  const nowM = today.getHours() * 60 + today.getMinutes();
  if (ws <= today && today < addDays(ws, 7) && inWindow(nowM)) {
    const chip = document.createElement("span");
    chip.className = "nowlabel"; chip.style.top = `${pct(nowM)}%`; chip.textContent = fmt(nowM);
    wgrid.querySelector(".gutter").appendChild(chip);
  }
}

function render() {
  const isWeek = state.view === "week";
  document.getElementById("weekView").hidden = !isWeek;
  document.getElementById("monthView").hidden = isWeek;
  document.getElementById("btnWeek").setAttribute("aria-pressed", String(isWeek));
  document.getElementById("btnMonth").setAttribute("aria-pressed", String(!isWeek));
  document.getElementById("btnToday").textContent = isWeek ? "本週" : "本月";

  if (isWeek) {
    const ws = startOfWeek(state.cursor), we = addDays(ws, 6);
    document.getElementById("periodLabel").textContent =
      `${ws.getFullYear()} 年 ${ws.getMonth() + 1} 月 ${ws.getDate()} 日 – ${we.getMonth() + 1} 月 ${we.getDate()} 日`;
    renderWeek();
  } else {
    document.getElementById("periodLabel").textContent =
      `${state.cursor.getFullYear()} 年 ${state.cursor.getMonth() + 1} 月`;
    renderMonth();
  }
  updateFooter();
}

function updateFooter() {
  const days = periodDays();                    // 跟住而家睇緊嘅週／月
  const totals = Object.fromEntries(CATS.map(c => [c.key, 0]));
  let free = 0, income = 0;
  for (const d of days) {
    for (const [a, b] of freeSlots(d)) free += b - a;
    for (const e of lessonsOn(d)) {
      totals[catOf(e.kind).key] += e.end - e.start;
      if (TYPE_BY[e.ltype]) income += feeOf(e);
    }
  }
  // 用橙色半透明嗰隻色嘅分類 = 手動開嘅可排課空檔，同自動計嗰啲加埋一齊數
  const manualOpen = CATS.filter(c => c.colour === "open")
                         .reduce((sum, c) => sum + totals[c.key], 0);
  const parts = CATS.filter(c => c.colour !== "open" && totals[c.key] > 0)
                    .map(c => `${c.label} ${hrs(totals[c.key])} 小時`);
  parts.push(`可排課 ${hrs(free + manualOpen)} 小時`);
  if (IS_OWNER && ratesSet() && income) parts.push(`收入 ${money(income)}`);
  document.getElementById("fLeft").textContent =
    (state.view === "week" ? "本週：" : "本月：") + parts.join(" ・ ");
  document.getElementById("fMid").textContent = CFG.copyright;
}

/* ---------------------------------------------------------------
   清除模式 —— 只有管理模式先有。喺日曆度直接揀日子。
   --------------------------------------------------------------- */
if (IS_OWNER) document.getElementById("btnClear").hidden = false;

function setClearMode(on) {
  clearMode = on;
  document.body.classList.toggle("clearing", on);
  if (!on) clearSel.clear();
  updateClearCount();
  render();
}
function toggleClearDay(key) {
  clearSel.has(key) ? clearSel.delete(key) : clearSel.add(key);
  updateClearCount();
  render();
}
function updateClearCount() {
  let lessons = 0;
  for (const key of clearSel) lessons += lessonsOn(parseYmd(key)).length;
  document.getElementById("clearCount").textContent =
    `已選 ${clearSel.size} 日 ・ ${lessons} 堂`;
}

document.getElementById("btnClear").onclick = () => setClearMode(!clearMode);
document.getElementById("clearExit").onclick = () => setClearMode(false);
document.getElementById("clearNone").onclick = () => { clearSel.clear(); updateClearCount(); render(); };

let clearArmed = false;
const clearGo = document.getElementById("clearGo");
clearGo.onclick = async () => {
  if (!clearSel.size) { toast("未揀任何日子。"); return; }
  if (!clearArmed) {
    clearArmed = true; clearGo.classList.add("arm");
    clearGo.textContent = `再撳一次，清空 ${clearSel.size} 日`;
    setTimeout(() => { clearArmed = false; clearGo.classList.remove("arm"); clearGo.textContent = "清空選中日子"; }, 5000);
    return;
  }
  clearArmed = false; clearGo.classList.remove("arm"); clearGo.textContent = "清空選中日子";
  clearGo.disabled = true;
  try {
    const r = await wipeDays([...clearSel]);
    if (!r.removed && !r.series) toast("嗰幾日本來就冇課堂。");
    else {
      toast(`已清空 ${clearSel.size} 日：刪咗 ${r.removed} 堂單次課，${r.series} 個重複系列跳過咗嗰幾日。`);
      clearSel.clear();
    }
    updateClearCount(); render();
  } catch (err) { console.error(err); toast("清唔到，請再試。"); }
  finally { clearGo.disabled = false; }
};

/* 單次課堂直接刪；重複課堂只跳過嗰一日，個系列保住 */
async function wipeDays(keys) {
  const removeIds = new Set();
  const skipAdds = new Map();
  for (const key of keys) {
    for (const e of lessonsOn(parseYmd(key))) {
      if (e.repeat) {
        if (!skipAdds.has(e.id)) skipAdds.set(e.id, new Set(e.skip || []));
        skipAdds.get(e.id).add(key);
      } else removeIds.add(e.id);
    }
  }
  for (const id of removeIds) await Store.remove(id);
  for (const [id, skips] of skipAdds) {
    const e = Store.all().find(x => x.id === id);
    if (e) await Store.save({ ...e, skip: [...skips] });
  }
  return { removed: removeIds.size, series: skipAdds.size };
}

function go(delta) {
  if (state.view === "week") state.cursor = addDays(state.cursor, 7 * delta);
  else state.cursor = new Date(state.cursor.getFullYear(), state.cursor.getMonth() + delta, 1);
  render();
}
document.getElementById("btnPrev").onclick = () => go(-1);
document.getElementById("btnNext").onclick = () => go(1);
document.getElementById("btnToday").onclick = () => { state.cursor = new Date(); render(); };
document.getElementById("btnMonth").onclick = () => { state.view = "month"; render(); };
document.getElementById("btnWeek").onclick = () => { state.view = "week"; render(); };

/* 拖曳揀時間 */
const SNAP = 15;
let drag = null;
function minutesAt(col, y) {
  const r = col.getBoundingClientRect();
  const raw = WIN_A + ((y - r.top) / r.height) * WIN;
  return Math.max(WIN_A, Math.min(WIN_B, Math.round(raw / SNAP) * SNAP));
}
wgrid.addEventListener("pointerdown", e => {
  if (clearMode || e.button !== 0 || e.target.closest(".ev,.slot,.locked")) return;
  const col = e.target.closest(".dcol"); if (!col) return;
  const m = minutesAt(col, e.clientY);
  const ghost = document.createElement("div"); ghost.className = "ghost-sel";
  col.appendChild(ghost);
  drag = { col, anchor: m, a: m, b: m + SNAP * 2, ghost, moved: false };
  paintGhost(); col.setPointerCapture(e.pointerId); e.preventDefault();
});
function paintGhost() {
  if (!drag) return;
  const a = Math.min(drag.a, drag.b), b = Math.max(drag.a, drag.b);
  drag.ghost.style.top = `${pct(a)}%`;
  drag.ghost.style.height = `${((b - a) / WIN) * 100}%`;
  drag.ghost.textContent = (b - a) >= 30 ? fmtRange(a, b) : "";
}
wgrid.addEventListener("pointermove", e => {
  if (!drag) return;
  const m = minutesAt(drag.col, e.clientY);
  if (m !== drag.b) drag.moved = true;
  drag.a = drag.anchor; drag.b = m;
  if (Math.abs(drag.b - drag.a) < SNAP) drag.b = drag.a + SNAP;
  paintGhost();
});
wgrid.addEventListener("pointerup", () => {
  if (!drag) return;
  const a = Math.min(drag.a, drag.b), b = Math.max(drag.a, drag.b);
  const key = drag.col.dataset.col, moved = drag.moved;
  drag.ghost.remove(); drag = null;
  openNew(parseYmd(key), a, Math.min(WIN_B, a + (moved ? Math.max(SNAP, b - a) : 60)));
});
wgrid.addEventListener("pointercancel", () => { if (drag) { drag.ghost.remove(); drag = null; } });

const fDow = document.getElementById("fDow"), fDate = document.getElementById("fDate");
const fStart = document.getElementById("fStart"), fEnd = document.getElementById("fEnd");
const fNote = document.getElementById("fNote"), fRepeat = document.getElementById("fRepeat");
const fType = document.getElementById("fType");
fType.innerHTML = `<option value="">（唔計 / 未定）</option>` +

const btnDelete = document.getElementById("btnDelete"), delChoice = document.getElementById("delChoice");
fStart.min = fEnd.min = CFG.dayStart;
fStart.max = fEnd.max = CFG.dayEnd;

let userTitle = "";                       // 記住用家自己打嗰個名，換返色就還返畀佢
function syncTitleLock() {

    fTitle.readOnly = true;

/* ---- 邊個刪得 ----
   locked: true 嘅分類（港大課堂）只有管理模式先刪得。
   訪客改得時間、名、顏色，但個刪除掣根本唔會出現。 */
const canDelete = ev => IS_OWNER || !catOf(ev && ev.kind).locked;

/* 圖例 + 顏色分類揀掣，兩邊都由 CFG.categories 生成 */
document.getElementById("legend").innerHTML =
  CATS.map(c => `<span class="key"><i class="sw c-${c.colour}"></i>${esc(c.label)}</span>`).join("") +
  // 已經有分類用緊橙色半透明就唔使再列一次「可排課空檔」
  (CATS.some(c => c.colour === "open") ? "" : `<span class="key"><i class="sw o"></i>可排課空檔</span>`) +
  `<span class="key"><i class="sw r"></i>不開放</span>`;

document.getElementById("kindPicker").innerHTML = CATS.map(c => `

    <i class="dot c-${c.colour}"></i><span>${esc(c.label)}</span>
    ${c.travel ? `<em class="trav" title="呢類課堂前後會自動預留 ${CFG.travelBuffer} 分鐘交通時間">＋交通</em>` : ""}
  </label>`).join("");

if (IS_OWNER) {
  document.getElementById("ownerTag").hidden = false;
  document.getElementById("noteField").hidden = false;
  document.getElementById("whoField").hidden = true;
}
document.getElementById("hTitle").firstChild.nodeValue = CFG.title;
document.getElementById("hSub").textContent = CFG.subtitle;
document.getElementById("fRight").textContent =
  (CFG.footNote ? CFG.footNote + " ・ " : "") + "所有時間為香港時間";
document.title = CFG.title;

let repeatHint = "";                       // 編輯緊現有課堂時嘅說明，開新嘅就用預設
function syncRepeat() {
  const on = fRepeat.checked;
  document.getElementById("repeatBox").classList.toggle("off", !on);
  document.getElementById("dowField").hidden = !on;
  document.getElementById("dateField").hidden = on;
  document.getElementById("repeatHint").textContent = on
    ? (repeatHint || "由你而家睇緊嗰一星期開始，之後每星期出現。以前嘅星期唔會補返。")
    : "只有這一日，之後不會重複";
}
fRepeat.addEventListener("change", () => { syncRepeat(); checkClash(); });
document.getElementById("kindPicker").addEventListener("change", syncTitleLock);

function openSheet() {
  sheet.classList.add("on"); backdrop.classList.add("on");
  sheet.setAttribute("aria-hidden", "false");
  setTimeout(() => fTitle.focus(), 170);
}
function closeSheet() {
  sheet.classList.remove("on"); backdrop.classList.remove("on");
  sheet.setAttribute("aria-hidden", "true");
  editing = null; editingOn = null; delChoice.hidden = true;
}
/* form.kind 係 RadioNodeList；分類得一個嘅時候會變成單一 input，所以統一用呢兩個 */
function setKind(key) {
  const k = CAT_BY[key] ? key : DEFAULT_CAT;
  const el = form.querySelector(`input[name="kind"][value="${CSS.escape(k)}"]`);
  if (el) el.checked = true;
}
function getKind() {
  const el = form.querySelector('input[name="kind"]:checked');
  return el ? el.value : DEFAULT_CAT;
}

/* 開新重複課堂嗰陣，第一次出現係邊日 —— 用你當時睇緊嗰一週 */
function firstOccurrence(dowSel) {
  const anchor = startOfWeek(editingOn ? parseYmd(editingOn) : state.cursor);
  return ymd(addDays(anchor, dowSel));
}

function setEnabled(on) {
  [...form.elements].forEach(el => el.disabled = !on);
  document.getElementById("btnSave").hidden = !on;
  [...document.querySelectorAll("#quick button")].forEach(b => b.disabled = !on);
}

function openNew(date, a, b) {
  const hit = lockHit(dowOf(date), a, b);
  if (hit && !IS_OWNER && !inOpenMarker(date, a, b)) {
    toast(`${DOW_ZH[dowOf(date)]} ${fmt(hit[0])} 之後唔開放預約。`); return;
  }
  editing = null; editingOn = ymd(date);
  document.getElementById("sheetTitle").textContent = IS_OWNER ? "新增課堂" : "預約時段";
  form.reset();
  repeatHint = "";
  fRepeat.checked = true; syncRepeat();
  userTitle = ""; fTitle.readOnly = false;
  fDow.value = String(dowOf(date));
  fDate.value = ymd(date);
  fStart.value = toHHMM(Math.max(WIN_A, Math.min(WIN_B - 15, a)));
  fEnd.value = toHHMM(Math.min(WIN_B, b));
  setKind(DEFAULT_CAT); syncTitleLock();
  fType.value = "";
  btnDelete.hidden = true; delChoice.hidden = true;
  document.getElementById("roNote").hidden = true;
  setEnabled(true); checkClash(); updateDur();
  openSheet();
}

/* 撳一格課堂。「可排課」格對訪客嚟講即係撳個空位 —— 開預約表格，唔係唯讀詳情 */
function openBlock(id, onKey) {
  const ev = Store.all().find(e => e.id === id);
  if (ev && isOpenMarker(ev.kind) && !IS_OWNER) {
    return openNew(parseYmd(onKey || ymd(state.cursor)), ev.start, Math.min(ev.end, ev.start + 120));
  }
  return openEvent(id, onKey);
}

function openEvent(id, onKey) {
  const ev = Store.all().find(e => e.id === id);
  if (!ev) return;
  editing = ev; editingOn = onKey || null;
  const deletable = canDelete(ev);
  document.getElementById("sheetTitle").textContent = "編輯課堂";
  fTitle.value = ev.title || "";
  userTitle = fTitle.value; fTitle.readOnly = false;
  fWho.value = ev.who || "";
  if (ev.repeat) {
    if (ev.from && ev.until)  repeatHint = `${ev.from} 至 ${ev.until}，每星期重複`;
    else if (ev.from)         repeatHint = `由 ${ev.from} 開始，每星期重複`;
    else                      repeatHint = "每星期重複（冇設開始日期，所有星期都會出現）";
  } else repeatHint = "";
  fRepeat.checked = !!ev.repeat; syncRepeat();
  fDow.value = String(ev.repeat ? ev.dow : dowOf(parseYmd(ev.date)));
  fDate.value = ev.repeat ? (onKey || "") : ev.date;
  fStart.value = toHHMM(ev.start); fEnd.value = toHHMM(ev.end);
  setKind(ev.kind); syncTitleLock();
  fType.value = TYPE_BY[ev.ltype] ? ev.ltype : "";
  if (IS_OWNER) fNote.value = ev.note || "";
  const ro = document.getElementById("roNote");
  ro.hidden = deletable;
  if (!deletable) ro.textContent =
    "港大課堂只有時間表擁有人先刪得。你可以改時間、改名、改顏色，但刪唔到 —— 有需要請直接搵 Bosco。";
  setEnabled(true);
  btnDelete.hidden = !deletable; delChoice.hidden = true;
  checkClash(); updateDur();
  openSheet();
}

document.getElementById("btnNew").onclick = () => {
  const base = state.view === "week" ? startOfWeek(state.cursor) : state.cursor;
  const now = new Date();
  openNew((base <= now && now < addDays(base, 7)) ? now : base, WIN_A + 60, WIN_A + 120);
};
document.getElementById("btnClose").onclick = closeSheet;
document.getElementById("btnCancel").onclick = closeSheet;
backdrop.onclick = () => { closeSheet(); closeFee(); };

document.getElementById("quick").addEventListener("click", e => {
  const b = e.target.closest("[data-min]");
  if (!b || !fStart.value) return;
  fEnd.value = toHHMM(Math.min(WIN_B, toMin(fStart.value) + Number(b.dataset.min)));
  checkClash(); updateDur();
});
function updateDur() {
  const out = document.getElementById("durOut");
  if (!fStart.value || !fEnd.value) { out.textContent = ""; return; }
  const d = toMin(fEnd.value) - toMin(fStart.value);
  out.textContent = d > 0 ? `共 ${hrs(d)} 小時` : "結束要遲過開始";
}
fStart.addEventListener("change", () => {
  if (fEnd.value && toMin(fEnd.value) <= toMin(fStart.value))
    fEnd.value = toHHMM(Math.min(WIN_B, toMin(fStart.value) + 60));
  checkClash(); updateDur();
});
[fEnd, fDow, fDate].forEach(el => el.addEventListener("change", () => { checkClash(); updateDur(); }));

function checkClash() {
  const box = document.getElementById("clash");
  if (!fStart.value || !fEnd.value) { box.hidden = true; return; }
  const s = toMin(fStart.value), e = toMin(fEnd.value);
  let probe;
  if (fRepeat.checked) probe = addDays(startOfWeek(state.cursor), Number(fDow.value));
  else if (fDate.value) probe = parseYmd(fDate.value);
  else { box.hidden = true; return; }
  const msgs = [];
  const locked = lockHit(dowOf(probe), s, e);
  if (locked) msgs.push(`呢個時間喺封鎖時段（${fmt(locked[0])}–${fmt(locked[1])}）入面，一般訪客預約唔到。`);
  const hits = lessonsOn(probe).filter(x => (!editing || x.id !== editing.id) && x.start < e && s < x.end);
  if (hits.length) msgs.push(`同 ${hits.map(h => `「${h.title}」（${fmtRange(h.start, h.end)}）`).join("、")} 撞時間。照樣儲存都可以，但當日會重疊。`);
  if (!msgs.length) { box.hidden = true; return; }
  document.getElementById("clashText").textContent = msgs.join(" ");
  box.hidden = false;
}

form.addEventListener("submit", async e => {
  e.preventDefault();
  const s = toMin(fStart.value), en = toMin(fEnd.value);
  if (en <= s) { toast("結束時間要遲過開始時間。"); fEnd.focus(); return; }
  if (s < WIN_A || en > WIN_B) { toast(`只可以排 ${fmt(WIN_A)} 至 ${fmt(WIN_B)} 之間。`); return; }
  if (!fRepeat.checked && !fDate.value) { toast("請揀日期。"); fDate.focus(); return; }

  const dowSel = fRepeat.checked ? Number(fDow.value) : dowOf(parseYmd(fDate.value));
  const probeDay = fRepeat.checked
    ? addDays(startOfWeek(editingOn ? parseYmd(editingOn) : state.cursor), dowSel)
    : parseYmd(fDate.value);
  const locked = lockHit(dowSel, s, en);
  if (locked && !IS_OWNER && !inOpenMarker(probeDay, s, en)) {
    toast(`${DOW_ZH[dowSel]} ${fmt(locked[0])}–${fmt(locked[1])} 唔開放預約，請揀第二個時間。`);
    return;
  }

  const rep = fRepeat.checked;
  const rec = {
    title: catOf(getKind()).fixedTitle || fTitle.value.trim() || "課堂",
    who: IS_OWNER ? (editing ? editing.who || "" : "") : fWho.value.trim(),
    kind: getKind(),
    note: IS_OWNER ? fNote.value.trim() : (editing ? editing.note || "" : ""),
    start: s, end: en,
    ltype: fType.value || "",
    repeat: rep,
    dow: rep ? dowSel : 0,
    date: rep ? "" : fDate.value,
    // 由你當時睇緊嗰一週嘅嗰一日開始計，以前嘅星期唔會出現
    from: rep ? (editing ? (editing.from || "") : firstOccurrence(dowSel)) : "",
    until: rep && editing ? (editing.until || "") : "",
    skip: editing ? (editing.skip || []) : [],
    status: IS_OWNER ? "busy" : "tentative",
    createdAt: editing ? (editing.createdAt || Date.now()) : Date.now()
  };
  if (editing) rec.id = editing.id;

  const save = document.getElementById("btnSave");
  save.disabled = true;
  try {
    await Store.save(rec);
    state.cursor = rep ? addDays(startOfWeek(state.cursor), rec.dow) : parseYmd(rec.date);
    const wasEditing = !!editing;
    closeSheet();
    toast(wasEditing ? "已更新。" : (rep ? "已加入，每週重複。" : "已加入，只此一次。"));
  } catch (err) {
    console.error(err);
    toast("儲存唔到。" + (err && err.message ? err.message : "請檢查網絡再試。"));
  } finally { save.disabled = false; }
});

/* 刪除：重複課堂要問清楚 */
btnDelete.onclick = () => {
  if (!editing || !canDelete(editing)) return;
  if (editing.repeat && editingOn) { btnDelete.hidden = true; delChoice.hidden = false; }
  else doDelete("all");
};
document.getElementById("delCancel").onclick = () => { delChoice.hidden = true; btnDelete.hidden = false; };
document.getElementById("delOne").onclick = () => doDelete("one");
document.getElementById("delAll").onclick = () => doDelete("later");

async function doDelete(scope) {
  if (!editing) return;
  if (!canDelete(editing)) { toast("港大課堂只有時間表擁有人先刪得。"); return; }
  const target = editing, on = editingOn;
  try {
    if (scope === "one" && target.repeat && on) {
      await Store.save({ ...target, skip: [...new Set([...(target.skip || []), on])] });
      closeSheet(); toast("已刪除這一次，之前之後嘅照舊。");
    } else if (scope === "later" && target.repeat && on) {
      const prevDay = ymd(addDays(parseYmd(on), -1));
      // 由第一次就開始刪 → 成個系列都冇咗，直接刪走張紀錄
      if (target.from && prevDay < target.from) {
        await Store.remove(target.id);
        closeSheet(); toast("已刪除整個系列。");
      } else {
        await Store.save({ ...target, until: prevDay });
        closeSheet(); toast(`已刪除 ${on} 同之後嘅，之前嘅照舊。`);
      }
    } else {
      await Store.remove(target.id);
      closeSheet(); toast("已刪除。");
    }
  } catch (err) { console.error(err); toast("刪除唔到，請再試。"); }
}

/* ---------------------------------------------------------------
   收費計算 —— 只有管理模式先見到，時薪只存喺本機
   --------------------------------------------------------------- */
const feeSheet = document.getElementById("feeSheet");
let feeSel = new Set();          // 剔咗嘅日子
let feePeriod = "";              // 用嚟判斷要唔要重設選擇

if (IS_OWNER) document.getElementById("btnFee").hidden = false;

/* 而家睇緊嗰段時間有邊幾日 */
function periodDays() {
  const out = [];
  if (state.view === "week") {
    const ws = startOfWeek(state.cursor);
    for (let i = 0; i < 7; i++) out.push(addDays(ws, i));
  } else {
    const y = state.cursor.getFullYear(), m = state.cursor.getMonth();
    const last = new Date(y, m + 1, 0).getDate();
    for (let i = 1; i <= last; i++) out.push(new Date(y, m, i));
  }
  return out;
}
function periodKey() {
  return state.view === "week"
    ? "w" + ymd(startOfWeek(state.cursor))
    : "m" + state.cursor.getFullYear() + "-" + (state.cursor.getMonth() + 1);
}

/* 每日嘅鐘數同金額 */
function dayFee(d) {
  let hours = 0, amount = 0, n = 0;
  for (const e of lessonsOn(d)) {
    if (!TYPE_BY[e.ltype]) continue;          // 冇類型 = 唔計錢
    hours += (e.end - e.start) / 60;
    amount += feeOf(e);
    n++;
  }
  return { hours, amount, n };
}

function openFee() {
  const pk = periodKey();
  if (pk !== feePeriod) {                     // 換咗週／月就重設，預設剔晒有收入嗰啲
    feePeriod = pk;
    feeSel = new Set(periodDays().filter(d => dayFee(d).n > 0).map(ymd));
  }
  document.getElementById("rateRows").innerHTML = TYPES.map(t => `
    <div class="raterow">
      <label for="rate-${esc(t.key)}">${esc(t.label)}<span style="color:var(--ink-3);font-weight:400"> ／小時</span></label>
      <input id="rate-${esc(t.key)}" type="number" min="0" step="10" inputmode="numeric"
             data-rate="${esc(t.key)}" value="${rateOf(t.key) || ""}" placeholder="0">
    </div>`).join("");
  document.getElementById("rateBox").open = !ratesSet();
  renderFee();
  feeSheet.classList.add("on"); backdrop.classList.add("on");
  feeSheet.setAttribute("aria-hidden", "false");
}
function closeFee() {
  feeSheet.classList.remove("on"); backdrop.classList.remove("on");
  feeSheet.setAttribute("aria-hidden", "true");
}

function renderFee() {
  const days = periodDays();
  document.getElementById("feeTitle").textContent =
    state.view === "week" ? "收費計算 ・ 本週" : `收費計算 ・ ${state.cursor.getMonth() + 1} 月`;

  document.getElementById("dayTable").innerHTML = days.map(d => {
    const key = ymd(d), f = dayFee(d), on = feeSel.has(key);
    return `
      <label class="dayrow ${f.n ? "" : "empty"} ${on ? "" : "off"}">
        <input type="checkbox" data-day="${key}" ${on ? "checked" : ""}>
        <span class="d">${d.getMonth() + 1}/${d.getDate()} ${DOW_ZH[dowOf(d)].slice(-1)}</span>
        <span class="h">${f.n ? hrs(f.hours * 60) + " 小時" : "冇收入課堂"}</span>
        <span class="m">${f.amount ? money(f.amount) : "—"}</span>
      </label>`;
  }).join("");

  // 分類型埋單
  const per = Object.fromEntries(TYPES.map(t => [t.key, { h: 0, amt: 0 }]));
  let grand = 0, totalH = 0;
  for (const d of days) {
    if (!feeSel.has(ymd(d))) continue;
    for (const e of lessonsOn(d)) {
      if (!TYPE_BY[e.ltype]) continue;
      const h = (e.end - e.start) / 60;
      per[e.ltype].h += h; per[e.ltype].amt += feeOf(e);
      grand += feeOf(e); totalH += h;
    }
  }
  const lines = TYPES.filter(t => per[t.key].h > 0).map(t => {
    const r = rateOf(t.key);
    return `<div class="line"><span>${esc(t.label)} ・ ${hrs(per[t.key].h * 60)} 小時${
      r ? ` × ${money(r)}` : ` <b style="color:var(--danger)">未設時薪</b>`}</span><span>${money(per[t.key].amt)}</span></div>`;
  }).join("");
  document.getElementById("feeTotal").innerHTML = lines + `
    <div class="grand">
      <span>合計 ・ ${feeSel.size} 日 ・ ${hrs(totalH * 60)} 小時</span>
      <span class="amt">${money(grand)}</span>
    </div>`;
}

document.getElementById("btnFee").onclick = openFee;
document.getElementById("feeClose").onclick = closeFee;

document.getElementById("rateRows").addEventListener("input", e => {
  const el = e.target.closest("[data-rate]"); if (!el) return;
  RATES[el.dataset.rate] = Math.max(0, Number(el.value) || 0);
  saveRates(); renderFee(); render();
});
document.getElementById("dayTable").addEventListener("change", e => {
  const el = e.target.closest("[data-day]"); if (!el) return;
  el.checked ? feeSel.add(el.dataset.day) : feeSel.delete(el.dataset.day);
  renderFee();
});
document.querySelector(".daypick").addEventListener("click", e => {
  const b = e.target.closest("[data-sel]"); if (!b) return;
  const days = periodDays();
  if (b.dataset.sel === "all") feeSel = new Set(days.map(ymd));
  else if (b.dataset.sel === "none") feeSel = new Set();
  else feeSel = new Set(days.filter(d => dayFee(d).n > 0).map(ymd));
  renderFee();
});

/* ---------------------------------------------------------------
   匯出 .ics（把未來 16 週的重複課堂展開）
   --------------------------------------------------------------- */
document.getElementById("btnIcs").onclick = () => {
  const stamp = d => d.getUTCFullYear() + pad(d.getUTCMonth()+1) + pad(d.getUTCDate()) + "T" +
                     pad(d.getUTCHours()) + pad(d.getUTCMinutes()) + "00Z";
  const at = (date, m) => { const d = new Date(date); d.setHours(Math.floor(m/60), m%60, 0, 0); return d; };
  const q = s => String(s).replace(/([,;\\])/g, "\\$1").replace(/\n/g, "\\n");
  const lines = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Bosco Fung Timetable//EN","CALSCALE:GREGORIAN"];
  const from = startOfWeek(new Date());
  let n = 0;
  for (let i = 0; i < 16 * 7; i++) {
    const d = addDays(from, i);
    for (const e of lessonsOn(d)) {
      lines.push("BEGIN:VEVENT",
        `UID:${e.id}-${ymd(d)}@timetable`,
        `DTSTAMP:${stamp(new Date())}`,
        `DTSTART:${stamp(at(d, e.start))}`,
        `DTEND:${stamp(at(d, e.end))}`,
        `SUMMARY:${q(e.title)}`,
        `CATEGORIES:${q(catOf(e.kind).label)}`,
        e.note ? `LOCATION:${q(e.note)}` : "",
        `STATUS:${e.status === "tentative" ? "TENTATIVE" : "CONFIRMED"}`,
        "END:VEVENT");
      n++;
    }
  }
  lines.push("END:VCALENDAR");
  if (!n) { toast("暫時無課堂可以匯出。"); return; }
  offerFile("timetable.ics", lines.filter(Boolean).join("\r\n"), "text/calendar");
};

async function offerFile(filename, text, mime) {
  try {
    if (window.claude && typeof window.claude.use === "function") {
      const dl = await window.claude.use("downloads");
      if (dl) { await dl.save({ filename, data: text }); toast("已儲存日曆檔。"); return; }
    }
  } catch (err) {
    if (err && err.code === "declined") return;
    console.warn("[timetable]", err);
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type: mime }));
  a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast("已下載日曆檔。");
}

/* ---------------------------------------------------------------
   雜項
   --------------------------------------------------------------- */
let toastT;
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("on");
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), 3200);
}
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && feeSheet.classList.contains("on")) { closeFee(); return; }
  if (e.key === "Escape" && sheet.classList.contains("on")) { closeSheet(); return; }
  if (sheet.classList.contains("on") || feeSheet.classList.contains("on")
      || e.target.matches("input,textarea,select")) return;
  if (e.key === "ArrowLeft") go(-1);
  else if (e.key === "ArrowRight") go(1);
  else if (e.key.toLowerCase() === "t") document.getElementById("btnToday").click();
  else if (e.key.toLowerCase() === "m") { state.view = "month"; render(); }
  else if (e.key.toLowerCase() === "w") { state.view = "week"; render(); }
  else if (e.key.toLowerCase() === "n") document.getElementById("btnNew").click();
});
setInterval(() => { if (state.view === "week") render(); }, 60000);

/* 用家喺網址加／刪 #密語 時要重新載入，管理模式先會生效 */
window.addEventListener("hashchange", () => location.reload());

syncRepeat();
Store.init(render);
render();
</script>
